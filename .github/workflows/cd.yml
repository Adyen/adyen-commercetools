# Release workflow. Runs only for strict semver tags (vMAJOR.MINOR.PATCH).
#   1. Build each image locally and scan it with Trivy; fixable CRITICAL/HIGH findings fail the release.
#   2. Push each image with BuildKit SLSA provenance (mode=max) and an SBOM attached to the image index.
#   3. Record a GitHub build-provenance attestation for each pushed digest (verifiable with
#      `gh attestation verify oci://index.docker.io/<image>@<digest> --repo <owner>/<repo>`).
#   4. Write the pushed digests to the job summary so release notes can reference immutable images.
# For more information see: https://github.com/marketplace/actions/build-and-push-docker-images

name: CD

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write      # OIDC token for Sigstore signing of the attestation
  attestations: write  # store the attestation on GitHub

env:
  EXTENSION_IMAGE: commercetools/commercetools-adyen-integration-extension
  NOTIFICATION_IMAGE: commercetools/commercetools-adyen-integration-notification

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---- build + scan (nothing is pushed yet) ----
      - name: Build extension module (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./extension
          file: ./extension/Dockerfile
          push: false
          load: true
          tags: ${{ env.EXTENSION_IMAGE }}:${{ steps.vars.outputs.tag }}
      - name: Scan extension module image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.EXTENSION_IMAGE }}:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Build notification module (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./notification
          file: ./notification/Dockerfile
          push: false
          load: true
          tags: ${{ env.NOTIFICATION_IMAGE }}:${{ steps.vars.outputs.tag }}
      - name: Scan notification module image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.NOTIFICATION_IMAGE }}:${{ steps.vars.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # ---- push with provenance + SBOM ----
      - name: Push extension module
        id: push_extension
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./extension
          file: ./extension/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.EXTENSION_IMAGE }}:${{ steps.vars.outputs.tag }}
      - name: Push notification module
        id: push_notification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./notification
          file: ./notification/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.NOTIFICATION_IMAGE }}:${{ steps.vars.outputs.tag }}

      # ---- GitHub build-provenance attestations (stored on GitHub, Sigstore-signed via OIDC) ----
      - name: Attest extension module image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.EXTENSION_IMAGE }}
          subject-digest: ${{ steps.push_extension.outputs.digest }}
          push-to-registry: false
      - name: Attest notification module image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.NOTIFICATION_IMAGE }}
          subject-digest: ${{ steps.push_notification.outputs.digest }}
          push-to-registry: false

      - name: Write image digests to the job summary
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          EXT_DIGEST: ${{ steps.push_extension.outputs.digest }}
          NOTIF_DIGEST: ${{ steps.push_notification.outputs.digest }}
        run: |
          {
            echo "## Release ${TAG} - published images"
            echo
            echo "Pin deployments to these immutable digests rather than the \`${TAG}\` tag:"
            echo
            echo '```'
            echo "${EXTENSION_IMAGE}@${EXT_DIGEST}"
            echo "${NOTIFICATION_IMAGE}@${NOTIF_DIGEST}"
            echo '```'
            echo
            echo "Verify provenance:"
            echo
            echo '```'
            echo "gh attestation verify oci://index.docker.io/${EXTENSION_IMAGE}@${EXT_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo "gh attestation verify oci://index.docker.io/${NOTIFICATION_IMAGE}@${NOTIF_DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
